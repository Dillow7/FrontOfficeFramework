spring.application.name=FrontOffice
server.port=8085

# ===== DATABASE CONFIGURATION =====
spring.datasource.url=jdbc:postgresql://localhost:5432/voiture_db
spring.datasource.username=postgres
spring.datasource.password=mihaja
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA CONFIGURATION =====
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== THYMELEAF CONFIGURATION =====
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# ===== BACKOFFICE API CONFIGURATION =====
backoffice.api.baseurl=http://localhost:3000/api
backoffice.api.timeout=30000
backoffice.api.token=CHANGE_ME_TOKEN

# ===== LOGGING =====
logging.level.root=INFO
logging.level.com.sprint.frontoffice=DEBUG
logging.level.org.springframework.web=DEBUG
